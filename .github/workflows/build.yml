name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # Newest macOS/Xcode GitHub offers (Xcode 26+ compiles the Liquid Glass icon).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: swift test

      - name: Build app
        run: |
          scripts/build-app.sh
          test -f build/PirateSwitch.app/Contents/Resources/Assets.car
          test -f build/PirateSwitch.app/Contents/Resources/AppIcon.icns
          test "$(lipo -archs build/PirateSwitch.app/Contents/MacOS/PirateSwitch)" = arm64

      - name: Render icon previews
        run: |
          ICTOOL="$(dirname "$(xcode-select -p)")/Applications/Icon Composer.app/Contents/Executables/ictool"
          mkdir -p build/icon-preview
          for rendition in Default Dark ClearDark TintedDark; do
            "$ICTOOL" "$PWD/Icon/AppIcon.icon" --export-image --output-file "build/icon-preview/$rendition.png" \
              --platform macOS --rendition "$rendition" --width 512 --height 512 --scale 1
          done

      - name: Package
        run: ditto -c -k --keepParent build/PirateSwitch.app build/PirateSwitch.zip

      - uses: actions/upload-artifact@v4
        with:
          name: PirateSwitch
          path: build/PirateSwitch.zip

      - uses: actions/upload-artifact@v4
        with:
          name: icon-preview
          path: build/icon-preview
